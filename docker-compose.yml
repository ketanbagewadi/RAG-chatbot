services:
  backend:
    image: ketanbagewadi/rag-chatbot-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/chroma_db:/app/backend/chroma_db
    restart: unless-stopped

  frontend:
    image: ketanbagewadi/rag-chatbot-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped