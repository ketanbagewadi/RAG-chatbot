<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Chatbot</title>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <style>
        /* ── Reset & Variables ──────────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0f12;
            --surface: #151820;
            --surface2: #1c2130;
            --border: #252c3d;
            --accent: #4f8ef7;
            --accent-dim: #2a4a8a;
            --accent-glow: rgba(79, 142, 247, 0.15);
            --green: #3ecf8e;
            --red: #f87171;
            --yellow: #fbbf24;
            --text: #e2e8f0;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --radius: 10px;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'IBM Plex Sans', sans-serif;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.6;
        }

        /* ── Layout ─────────────────────────────────────────────────────────────── */
        .app {
            display: grid;
            grid-template-columns: 260px 1fr;
            grid-template-rows: 52px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Top bar ─────────────────────────────────────────────────────────────── */
        .topbar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .topbar-logo {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 0.06em;
        }

        .topbar-logo span {
            color: var(--text-muted);
        }

        .topbar-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background .3s;
        }

        .status-dot.ok {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        .status-dot.err {
            background: var(--red);
        }

        /* ── Sidebar ─────────────────────────────────────────────────────────────── */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-label {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* Upload area */
        .upload-zone {
            border: 1.5px dashed var(--border);
            border-radius: var(--radius);
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            position: relative;
        }

        .upload-zone:hover,
        .upload-zone.drag {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .upload-zone input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .upload-zone-icon {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .upload-zone-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        .upload-zone-hint {
            font-size: 11px;
            color: var(--text-muted);
            opacity: .6;
            margin-top: 3px;
        }

        /* Upload progress */
        .upload-progress {
            margin-top: 10px;
            display: none;
        }

        .upload-progress.show {
            display: block;
        }

        .progress-bar-wrap {
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 2px;
            transition: width .3s;
            animation: indeterminate 1.2s ease infinite;
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-100%);
                width: 60%;
            }

            100% {
                transform: translateX(200%);
                width: 60%;
            }
        }

        .upload-status-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
            font-family: var(--mono);
        }

        /* Document list */
        .doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
        }

        .doc-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-dim);
            transition: background .15s;
            cursor: default;
        }

        .doc-item:hover {
            background: var(--surface2);
        }

        .doc-item-icon {
            font-size: 14px;
            flex-shrink: 0;
        }

        .doc-item-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-empty {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
        }

        /* Sidebar bottom */
        .sidebar-bottom {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        .btn-clear {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 12px;
            font-family: var(--sans);
            cursor: pointer;
            transition: all .2s;
        }

        .btn-clear:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(248, 113, 113, .06);
        }

        /* ── Chat area ───────────────────────────────────────────────────────────── */
        .chat-area {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        /* LLM mode badge */
        .llm-badge {
            margin: 10px 20px 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 12px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-muted);
            align-self: flex-start;
        }

        .llm-badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--yellow);
        }

        .llm-badge-dot.openai {
            background: var(--green);
        }

        .llm-badge-dot.ollama {
            background: var(--accent);
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        /* Welcome screen */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .welcome-icon {
            font-size: 36px;
            margin-bottom: 4px;
        }

        .welcome h2 {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-dim);
        }

        .welcome p {
            font-size: 13px;
            max-width: 320px;
            line-height: 1.7;
        }

        /* Message bubbles */
        .msg {
            display: flex;
            gap: 10px;
            max-width: 820px;
            width: 100%;
            align-self: flex-start;
            animation: fadeUp .2s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg.user .msg-avatar {
            background: var(--accent-dim);
        }

        .msg.bot .msg-avatar {
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: calc(100% - 38px);
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 13.5px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.user .msg-bubble {
            background: var(--accent-dim);
            color: #c8d9ff;
            border-bottom-right-radius: 3px;
        }

        .msg.bot .msg-bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 3px;
        }

        .msg.bot.streaming .msg-bubble::after {
            content: '▌';
            animation: blink .7s step-end infinite;
            color: var(--accent);
            margin-left: 2px;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Sources */
        .msg-sources {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 2px;
        }

        .source-tag {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 7px;
        }

        /* Thinking indicator */
        .thinking {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            border-bottom-left-radius: 3px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--mono);
        }

        .thinking-dots span {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            margin: 0 1px;
            animation: dot-bounce .8s ease infinite;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes dot-bounce {

            0%,
            100% {
                transform: translateY(0);
                opacity: .4;
            }

            50% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* ── Input bar ───────────────────────────────────────────────────────────── */
        .input-bar {
            padding: 12px 20px 16px;
            background: var(--bg);
            border-top: 1px solid var(--border);
        }

        .input-wrap {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 10px;
            transition: border-color .2s;
        }

        .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 13.5px;
            font-family: var(--sans);
            resize: none;
            max-height: 120px;
            line-height: 1.6;
        }

        #chat-input::placeholder {
            color: var(--text-muted);
        }

        .btn-send {
            width: 34px;
            height: 34px;
            border-radius: 7px;
            background: var(--accent);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: all .2s;
            color: #fff;
        }

        .btn-send:hover:not(:disabled) {
            background: #6aa0ff;
            transform: scale(1.05);
        }

        .btn-send:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        .input-hint {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
            margin-top: 5px;
            font-family: var(--mono);
        }

        /* ── Scrollbar ───────────────────────────────────────────────────────────── */
        .doc-list::-webkit-scrollbar {
            width: 3px;
        }

        .doc-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .doc-list::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        /* ── Toast ───────────────────────────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 12px;
            font-family: var(--mono);
            color: var(--text);
            z-index: 999;
            animation: slideIn .25s ease;
            max-width: 300px;
        }

        .toast.success {
            border-color: var(--green);
            color: var(--green);
        }

        .toast.error {
            border-color: var(--red);
            color: var(--red);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- ── Top bar ─────────────────────────────────────────────────────────── -->
        <header class="topbar">
            <div class="topbar-logo">RAG<span>/</span>CHAT</div>
            <div class="topbar-status">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">connecting…</span>
            </div>
        </header>

        <!-- ── Sidebar ────────────────────────────────────────────────────────── -->
        <aside class="sidebar">

            <!-- Upload -->
            <div class="sidebar-section">
                <div class="sidebar-label">Knowledge Base</div>
                <div class="upload-zone" id="upload-zone">
                    <input type="file" id="file-input" accept=".pdf,.txt,.docx,.md" multiple />
                    <div class="upload-zone-icon">📄</div>
                    <div class="upload-zone-text">Drop files or click to upload</div>
                    <div class="upload-zone-hint">PDF · TXT · DOCX · MD</div>
                </div>
                <div class="upload-progress" id="upload-progress">
                    <div class="progress-bar-wrap">
                        <div class="progress-bar"></div>
                    </div>
                    <div class="upload-status-text" id="upload-status-text">Uploading…</div>
                </div>
            </div>

            <!-- Document list -->
            <div class="sidebar-label"
                style="padding: 12px 16px 0; font-family: var(--mono); font-size: 10px; font-weight:500; color:var(--text-muted); letter-spacing:.1em; text-transform:uppercase;">
                Documents
            </div>
            <div class="doc-list" id="doc-list">
                <div class="doc-empty" id="doc-empty">No documents yet</div>
            </div>

            <!-- Clear button -->
            <div class="sidebar-bottom">
                <button class="btn-clear" id="btn-clear">🗑 Clear all documents</button>
            </div>

        </aside>

        <!-- ── Chat area ──────────────────────────────────────────────────────── -->
        <main class="chat-area">

            <!-- LLM badge -->
            <div class="llm-badge" id="llm-badge">
                <div class="llm-badge-dot" id="llm-badge-dot"></div>
                <span id="llm-badge-text">loading…</span>
            </div>

            <!-- Messages -->
            <div class="messages" id="messages">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🧠</div>
                    <h2>RAG Chatbot</h2>
                    <p>Upload documents on the left, then ask questions. The bot will answer using only your documents.
                    </p>
                </div>
            </div>

            <!-- Input bar -->
            <div class="input-bar">
                <div class="input-wrap">
                    <textarea id="chat-input" rows="1" placeholder="Ask a question about your documents…"></textarea>
                    <button class="btn-send" id="btn-send" title="Send">➤</button>
                </div>
                <div class="input-hint">Enter to send · Shift+Enter for newline</div>
            </div>

        </main>
    </div>

    <script>
        // ── Config ─────────────────────────────────────────────────────────────────
        const API = "http://localhost:8000";

        // ── State ──────────────────────────────────────────────────────────────────
        let history = [];          // [{role, content}, ...]
        let isStreaming = false;

        // ── DOM refs ───────────────────────────────────────────────────────────────
        const messagesEl = document.getElementById("messages");
        const chatInput = document.getElementById("chat-input");
        const btnSend = document.getElementById("btn-send");
        const welcomeEl = document.getElementById("welcome");
        const docList = document.getElementById("doc-list");
        const docEmpty = document.getElementById("doc-empty");
        const fileInput = document.getElementById("file-input");
        const uploadZone = document.getElementById("upload-zone");
        const uploadProgress = document.getElementById("upload-progress");
        const uploadStatus = document.getElementById("upload-status-text");
        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const llmBadge = document.getElementById("llm-badge");
        const llmBadgeDot = document.getElementById("llm-badge-dot");
        const llmBadgeText = document.getElementById("llm-badge-text");
        const btnClear = document.getElementById("btn-clear");

        // ══════════════════════════════════════════════════════════════════════════
        // HEALTH CHECK
        // ══════════════════════════════════════════════════════════════════════════

        async function checkHealth() {
            try {
                const res = await fetch(`${API}/health`);
                const data = await res.json();

                // Status dot
                statusDot.className = "status-dot ok";
                statusText.textContent = `${data.vector_db.chunks} chunks`;

                // LLM badge
                const mode = data.llm.mode;
                const model = data.llm.model;
                llmBadgeDot.className = `llm-badge-dot ${mode}`;
                llmBadgeText.textContent = `${mode} · ${model}`;

            } catch {
                statusDot.className = "status-dot err";
                statusText.textContent = "backend offline";
                llmBadgeText.textContent = "not connected";
            }
        }

        // ══════════════════════════════════════════════════════════════════════════
        // DOCUMENT LIST
        // ══════════════════════════════════════════════════════════════════════════

        const FILE_ICONS = { pdf: "📕", txt: "📄", docx: "📘", md: "📝" };

        async function loadDocuments() {
            try {
                const res = await fetch(`${API}/documents`);
                const data = await res.json();
                renderDocList(data.documents);
            } catch { /* backend offline */ }
        }

        function renderDocList(docs) {
            docEmpty.style.display = docs.length ? "none" : "block";
            // Remove old items
            [...docList.querySelectorAll(".doc-item")].forEach(el => el.remove());

            docs.forEach(name => {
                const ext = name.split(".").pop().toLowerCase();
                const icon = FILE_ICONS[ext] || "📄";
                const el = document.createElement("div");
                el.className = "doc-item";
                el.innerHTML = `<span class="doc-item-icon">${icon}</span>
                      <span class="doc-item-name" title="${name}">${name}</span>`;
                docList.appendChild(el);
            });
        }

        // ══════════════════════════════════════════════════════════════════════════
        // FILE UPLOAD
        // ══════════════════════════════════════════════════════════════════════════

        async function uploadFile(file) {
            uploadProgress.classList.add("show");
            uploadStatus.textContent = `Uploading ${file.name}…`;

            const form = new FormData();
            form.append("file", file);

            try {
                const res = await fetch(`${API}/upload`, { method: "POST", body: form });
                const data = await res.json();

                if (!res.ok) throw new Error(data.detail || "Upload failed");

                uploadStatus.textContent = `✓ ${file.name} — ${data.chunks} chunks`;
                showToast(`Ingested ${file.name} (${data.chunks} chunks)`, "success");
                await loadDocuments();
                await checkHealth();

            } catch (err) {
                uploadStatus.textContent = `✗ ${err.message}`;
                showToast(err.message, "error");
            } finally {
                setTimeout(() => {
                    uploadProgress.classList.remove("show");
                    uploadStatus.textContent = "";
                }, 3000);
            }
        }

        fileInput.addEventListener("change", async () => {
            for (const file of fileInput.files) await uploadFile(file);
            fileInput.value = "";
        });

        // Drag & drop
        uploadZone.addEventListener("dragover", e => { e.preventDefault(); uploadZone.classList.add("drag"); });
        uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("drag"));
        uploadZone.addEventListener("drop", async e => {
            e.preventDefault();
            uploadZone.classList.remove("drag");
            for (const file of e.dataTransfer.files) await uploadFile(file);
        });

        // ══════════════════════════════════════════════════════════════════════════
        // CLEAR DOCUMENTS
        // ══════════════════════════════════════════════════════════════════════════

        btnClear.addEventListener("click", async () => {
            if (!confirm("Delete all documents and clear the vector DB?")) return;
            try {
                await fetch(`${API}/documents`, { method: "DELETE" });
                renderDocList([]);
                history = [];
                showToast("Knowledge base cleared.", "success");
                await checkHealth();
            } catch {
                showToast("Failed to clear documents.", "error");
            }
        });

        // ══════════════════════════════════════════════════════════════════════════
        // CHAT — MESSAGES
        // ══════════════════════════════════════════════════════════════════════════

        function hideWelcome() {
            if (welcomeEl) welcomeEl.remove();
        }

        function addMessage(role, content = "") {
            hideWelcome();
            const wrapper = document.createElement("div");
            wrapper.className = `msg ${role}`;

            const avatar = document.createElement("div");
            avatar.className = "msg-avatar";
            avatar.textContent = role === "user" ? "👤" : "🤖";

            const body = document.createElement("div");
            body.className = "msg-body";

            const bubble = document.createElement("div");
            bubble.className = "msg-bubble";
            bubble.textContent = content;

            body.appendChild(bubble);
            wrapper.appendChild(avatar);
            wrapper.appendChild(body);
            messagesEl.appendChild(wrapper);
            scrollToBottom();

            return { wrapper, bubble, body };
        }

        function addThinking() {
            hideWelcome();
            const wrapper = document.createElement("div");
            wrapper.className = "msg bot";

            const avatar = document.createElement("div");
            avatar.className = "msg-avatar";
            avatar.textContent = "🤖";

            const body = document.createElement("div");
            body.className = "msg-body";

            body.innerHTML = `
      <div class="thinking">
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
        Retrieving context…
      </div>`;

            wrapper.appendChild(avatar);
            wrapper.appendChild(body);
            messagesEl.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ══════════════════════════════════════════════════════════════════════════
        // CHAT — SEND + STREAM
        // ══════════════════════════════════════════════════════════════════════════

        async function sendMessage() {
            const question = chatInput.value.trim();
            if (!question || isStreaming) return;

            isStreaming = true;
            btnSend.disabled = true;
            chatInput.value = "";
            autoResize();

            // Show user message
            addMessage("user", question);

            // Add to history
            history.push({ role: "user", content: question });

            // Show thinking indicator
            const thinkingEl = addThinking();

            try {
                const res = await fetch(`${API}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question, history: history.slice(0, -1) }),
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || "Request failed");
                }

                // Replace thinking with streaming bubble
                thinkingEl.remove();
                const { wrapper, bubble, body } = addMessage("bot", "");
                wrapper.classList.add("streaming");

                // Read SSE stream
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split("\n");

                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        const token = line.slice(6);
                        if (token === "[DONE]") break;
                        if (token.startsWith("[ERROR]")) {
                            bubble.textContent += "\n\n⚠ " + token.slice(8);
                            break;
                        }
                        fullText += token;
                        bubble.textContent = fullText;
                        scrollToBottom();
                    }
                }

                wrapper.classList.remove("streaming");
                history.push({ role: "assistant", content: fullText });
                await checkHealth();   // update chunk count if new doc was added

            } catch (err) {
                thinkingEl.remove();
                addMessage("bot", "⚠ " + err.message);
            } finally {
                isStreaming = false;
                btnSend.disabled = false;
                chatInput.focus();
            }
        }

        // ══════════════════════════════════════════════════════════════════════════
        // INPUT HANDLING
        // ══════════════════════════════════════════════════════════════════════════

        function autoResize() {
            chatInput.style.height = "auto";
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
        }

        chatInput.addEventListener("input", autoResize);
        chatInput.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        btnSend.addEventListener("click", sendMessage);

        // ══════════════════════════════════════════════════════════════════════════
        // TOAST
        // ══════════════════════════════════════════════════════════════════════════

        function showToast(msg, type = "info") {
            const t = document.createElement("div");
            t.className = `toast ${type}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        // ══════════════════════════════════════════════════════════════════════════
        // INIT
        // ══════════════════════════════════════════════════════════════════════════

        (async () => {
            await checkHealth();
            await loadDocuments();
            chatInput.focus();
            // Re-check health every 30s
            setInterval(checkHealth, 30_000);
        })();
    </script>
</body>

</html>
