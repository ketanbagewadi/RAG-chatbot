<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #212121;
      --sidebar-bg:  #171717;
      --surface:     #2f2f2f;
      --surface2:    #3a3a3a;
      --border:      #3a3a3a;
      --accent:      #d97706;
      --accent-soft: rgba(217,119,6,0.15);
      --text:        #ececec;
      --text-muted:  #8e8e8e;
      --text-dim:    #b4b4b4;
      --sans:        'Inter', sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.6; }

    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px; flex-shrink: 0;
      background: var(--sidebar-bg);
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .sidebar-header {
      padding: 18px 16px 12px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo {
      width: 28px; height: 28px;
      background: var(--accent); border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .sidebar-title { font-size: 14px; font-weight: 600; }
    .sidebar-sub   { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .sidebar-section { padding: 12px 16px; }
    .section-label {
      font-size: 11px; font-weight: 500; color: var(--text-muted);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px;
    }

    /* Upload */
    .upload-zone {
      border: 1.5px dashed var(--border); border-radius: 10px;
      padding: 16px 12px; text-align: center;
      cursor: pointer; position: relative; transition: all .2s;
    }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: var(--accent-soft); }
    .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-icon { font-size: 20px; margin-bottom: 5px; }
    .upload-text { font-size: 12px; color: var(--text-muted); }
    .upload-hint { font-size: 11px; color: var(--text-muted); opacity: .55; margin-top: 2px; }

    .upload-progress { display: none; margin-top: 10px; }
    .upload-progress.show { display: block; }
    .prog-bar-wrap { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .prog-bar { height: 100%; background: var(--accent); border-radius: 2px; animation: slide 1s ease infinite; }
    @keyframes slide { 0%{transform:translateX(-100%);width:60%} 100%{transform:translateX(200%);width:60%} }
    .prog-text { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

    /* Doc list */
    .doc-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .doc-list::-webkit-scrollbar { width: 3px; }
    .doc-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .doc-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px; border-radius: 8px;
      font-size: 12.5px; color: var(--text-dim);
      cursor: default; transition: background .15s;
    }
    .doc-item:hover { background: var(--surface); }
    .doc-icon { font-size: 14px; flex-shrink: 0; }
    .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 16px 0; }

    /* Footer */
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
    .status-row {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--text-muted); margin-bottom: 10px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); transition: background .3s; flex-shrink: 0; }
    .status-dot.ok  { background: #22c55e; box-shadow: 0 0 5px #22c55e55; }
    .status-dot.err { background: #ef4444; }
    .btn-clear {
      width: 100%; padding: 8px; background: transparent;
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-muted); font-size: 12px; font-family: var(--sans);
      cursor: pointer; transition: all .2s;
    }
    .btn-clear:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,.07); }

    /* ── Chat ── */
    .chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    .topbar {
      padding: 14px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .llm-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px;
      font-size: 12px; color: var(--text-muted);
    }
    .llm-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
    .llm-dot.ollama { background: #60a5fa; }
    .topbar-chunks { margin-left: auto; font-size: 12px; color: var(--text-muted); }

    /* Messages */
    .messages { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Welcome */
    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 12px; padding: 40px; text-align: center;
    }
    .welcome-logo {
      width: 52px; height: 52px; background: var(--accent);
      border-radius: 14px; display: flex; align-items: center;
      justify-content: center; font-size: 24px; margin-bottom: 4px;
    }
    .welcome h2 { font-size: 22px; font-weight: 600; }
    .welcome p  { font-size: 14px; color: var(--text-muted); max-width: 340px; line-height: 1.7; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .suggestion-btn {
      padding: 8px 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px;
      color: var(--text-dim); font-size: 13px; font-family: var(--sans);
      cursor: pointer; transition: all .2s;
    }
    .suggestion-btn:hover { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }

    /* Message rows */
    .msg-row { padding: 20px 0; animation: fadeUp .2s ease; }
    .msg-row.user .msg-inner { flex-direction: row-reverse; }
    .msg-row.user .msg-bubble {
      background: var(--surface);
      border-radius: 18px 4px 18px 18px;
      padding: 10px 14px;
      display: inline-block;
    }
    .msg-row.user .msg-content { display: flex; flex-direction: column; align-items: flex-end; }
    .msg-row.user .msg-name { text-align: right; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

    .msg-inner {
      max-width: 720px; margin: 0 auto; padding: 0 24px;
      display: flex; gap: 14px;
    }
    .msg-avatar { display: none; }
    .msg-row.user .msg-avatar { background: var(--surface2); }
    .msg-row.bot  .msg-avatar { background: var(--accent); }
    .msg-content { flex: 1; min-width: 0; }
    .msg-name { display: none; }
    .msg-bubble { font-size: 14.5px; line-height: 1.75; color: var(--text); }

    /* Markdown */
    .msg-bubble p  { margin-bottom: 10px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 22px; margin-bottom: 10px; }
    .msg-bubble li { margin-bottom: 5px; }
    .msg-bubble strong { color: #fff; font-weight: 600; }
    .msg-bubble em { color: var(--text-dim); }
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 { color: #fff; font-weight: 600; margin: 14px 0 8px; }
    .msg-bubble h1 { font-size: 18px; }
    .msg-bubble h2 { font-size: 16px; }
    .msg-bubble h3 { font-size: 14px; }
    .msg-bubble code {
      background: var(--surface2); padding: 2px 6px; border-radius: 5px;
      font-size: 13px; font-family: 'Courier New', monospace; color: #fbbf24;
    }
    .msg-bubble pre {
      background: #1a1a1a; border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 10px 0;
    }
    .msg-bubble pre code { background: none; padding: 0; color: #e2e8f0; font-size: 13px; }
    .msg-bubble blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--text-dim); margin: 10px 0; }
    .msg-bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
    .msg-bubble th, .msg-bubble td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .msg-bubble th { background: var(--surface); font-weight: 600; }
    .msg-bubble hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

    /* Streaming cursor */
    .msg-row.streaming .msg-bubble::after {
      content: '▋'; animation: blink .6s step-end infinite; color: var(--accent); margin-left: 2px;
    }
    @keyframes blink { 50%{opacity:0} }

    /* Thinking */
    .thinking-row { padding: 20px 0; animation: fadeUp .2s ease; }
    .thinking-inner {
      max-width: 720px; margin: 0 auto; padding: 0 24px;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .thinking-avatar { display: none; }
    .thinking-body { padding-top: 4px; }
    .thinking-label { font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; }
    .dots { display: flex; gap: 4px; }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted); animation: dotbounce .8s ease infinite;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes dotbounce { 0%,100%{transform:translateY(0);opacity:.4} 50%{transform:translateY(-5px);opacity:1} }

    /* Input */
    .input-area { padding: 16px 24px 20px; flex-shrink: 0; }
    .input-box-wrap {
      max-width: 720px; margin: 0 auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-box-wrap:focus-within { border-color: #555; box-shadow: 0 0 0 3px rgba(255,255,255,.04); }
    #chat-input {
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14.5px; font-family: var(--sans);
      resize: none; max-height: 180px; line-height: 1.6; width: 100%;
    }
    #chat-input::placeholder { color: var(--text-muted); }
    .input-actions { display: flex; align-items: center; justify-content: space-between; }
    .input-hint { font-size: 11.5px; color: var(--text-muted); }
    .btn-send {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .2s;
    }
    .btn-send:hover:not(:disabled) { background: #f59e0b; transform: scale(1.05); }
    .btn-send:disabled { background: var(--surface2); cursor: not-allowed; transform: none; }
    .btn-send svg { width: 16px; height: 16px; fill: #fff; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 16px;
      font-size: 13px; color: var(--text); z-index: 999;
      animation: slideIn .25s ease; max-width: 300px;
    }
    .toast.success { border-color: #22c55e; color: #22c55e; }
    .toast.error   { border-color: #ef4444; color: #ef4444; }
    @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" style="font-size:11px;font-weight:700;color:#fff;letter-spacing:.5px;">RC</div>
      <div>
        <div class="sidebar-title">RAG Chat</div>
        <div class="sidebar-sub">Document assistant</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Knowledge Base</div>
      <div class="upload-zone" id="upload-zone">
        <input type="file" id="file-input" accept=".pdf,.txt,.docx,.md" multiple />
        <div class="upload-icon">📎</div>
        <div class="upload-text">Drop files or click to upload</div>
        <div class="upload-hint">PDF · TXT · DOCX · MD</div>
      </div>
      <div class="upload-progress" id="upload-progress">
        <div class="prog-bar-wrap"><div class="prog-bar"></div></div>
        <div class="prog-text" id="prog-text">Uploading…</div>
      </div>
    </div>

    <div class="sidebar-section" style="padding-bottom:4px;">
      <div class="section-label">Documents</div>
    </div>
    <div class="doc-list" id="doc-list">
      <div class="doc-empty" id="doc-empty">No documents yet</div>
    </div>

    <div class="sidebar-footer">
      <div class="status-row">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Connecting…</span>
      </div>
      <button class="btn-clear" id="btn-clear">🗑 Clear all documents</button>
    </div>
  </aside>

  <main class="chat-main">
    <div class="topbar">
      <div class="llm-pill">
        <div class="llm-dot" id="llm-dot"></div>
        <span id="llm-text">Loading…</span>
      </div>
      <div class="topbar-chunks" id="topbar-chunks"></div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-logo" style="font-size:18px;font-weight:700;color:#fff;letter-spacing:1px;">RC</div>
        <h2>How can I help you?</h2>
        <p>Upload documents in the sidebar and ask me anything about them.</p>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="suggest(this)">Summarize my documents</button>
          <button class="suggestion-btn" onclick="suggest(this)">What are the key points?</button>
          <button class="suggestion-btn" onclick="suggest(this)">Explain the main topic</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box-wrap">
        <textarea id="chat-input" rows="1" placeholder="Message RAG Chat…"></textarea>
        <div class="input-actions">
          <span class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for newline</span>
          <button class="btn-send" id="btn-send" title="Send">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const API = "http://localhost:8000";
  let history = [];
  let isStreaming = false;

  const messagesEl   = document.getElementById("messages");
  const chatInput    = document.getElementById("chat-input");
  const btnSend      = document.getElementById("btn-send");
  const docList      = document.getElementById("doc-list");
  const docEmpty     = document.getElementById("doc-empty");
  const fileInput    = document.getElementById("file-input");
  const uploadZone   = document.getElementById("upload-zone");
  const uploadProg   = document.getElementById("upload-progress");
  const progText     = document.getElementById("prog-text");
  const statusDot    = document.getElementById("status-dot");
  const statusText   = document.getElementById("status-text");
  const llmDot       = document.getElementById("llm-dot");
  const llmText      = document.getElementById("llm-text");
  const topbarChunks = document.getElementById("topbar-chunks");
  const btnClear     = document.getElementById("btn-clear");

  marked.setOptions({ breaks: true, gfm: true });

  async function checkHealth() {
    try {
      const res  = await fetch(`${API}/health`);
      const data = await res.json();
      statusDot.className = "status-dot ok";
      statusText.textContent = "Connected";
      llmDot.className = `llm-dot ${data.llm.mode}`;
      llmText.textContent = `${data.llm.mode === "openai" ? "OpenAI" : "Ollama"} · ${data.llm.model}`;
      topbarChunks.textContent = `${data.vector_db.chunks} chunks`;
    } catch {
      statusDot.className = "status-dot err";
      statusText.textContent = "Backend offline";
      llmText.textContent = "Not connected";
    }
  }

  const FILE_ICONS = { pdf:"📕", txt:"📄", docx:"📘", md:"📝" };

  async function loadDocuments() {
    try {
      const res  = await fetch(`${API}/documents`);
      const data = await res.json();
      renderDocs(data.documents);
    } catch {}
  }

  function renderDocs(docs) {
    docEmpty.style.display = docs.length ? "none" : "block";
    [...docList.querySelectorAll(".doc-item")].forEach(el => el.remove());
    docs.forEach(name => {
      const ext = name.split(".").pop().toLowerCase();
      const el  = document.createElement("div");
      el.className = "doc-item";
      el.innerHTML = `<span class="doc-icon">${FILE_ICONS[ext] || "📄"}</span><span class="doc-name" title="${name}">${name}</span>`;
      docList.appendChild(el);
    });
  }

  async function uploadFile(file) {
    uploadProg.classList.add("show");
    progText.textContent = `Uploading ${file.name}…`;
    const form = new FormData();
    form.append("file", file);
    try {
      const res  = await fetch(`${API}/upload`, { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Upload failed");
      progText.textContent = `✓ ${file.name}`;
      showToast(`Ingested: ${file.name} (${data.chunks} chunks)`, "success");
      await loadDocuments();
      await checkHealth();
    } catch (err) {
      progText.textContent = `✗ ${err.message}`;
      showToast(err.message, "error");
    } finally {
      setTimeout(() => { uploadProg.classList.remove("show"); progText.textContent = ""; }, 3000);
    }
  }

  fileInput.addEventListener("change", async () => {
    for (const f of fileInput.files) await uploadFile(f);
    fileInput.value = "";
  });
  uploadZone.addEventListener("dragover",  e => { e.preventDefault(); uploadZone.classList.add("drag"); });
  uploadZone.addEventListener("dragleave", ()  => uploadZone.classList.remove("drag"));
  uploadZone.addEventListener("drop", async e => {
    e.preventDefault(); uploadZone.classList.remove("drag");
    for (const f of e.dataTransfer.files) await uploadFile(f);
  });

  btnClear.addEventListener("click", async () => {
    if (!confirm("Delete all documents and clear the vector DB?")) return;
    try {
      await fetch(`${API}/documents`, { method: "DELETE" });
      renderDocs([]); history = [];
      showToast("Knowledge base cleared.", "success");
      await checkHealth();
    } catch { showToast("Failed to clear.", "error"); }
  });

  function hideWelcome() {
    const w = document.getElementById("welcome");
    if (w) w.remove();
  }

  function addUserMessage(text) {
    hideWelcome();
    const row = document.createElement("div");
    row.className = "msg-row user";
    // replace
    row.innerHTML = `
          <div class="msg-inner">
            <div class="msg-avatar" style="font-size:12px;font-weight:600;color:#fff;">You</div>
            <div class="msg-content">
              <div class="msg-bubble">${escapeHtml(text)}</div>
            </div>
          </div>`;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function addBotMessage() {
    hideWelcome();
    const row = document.createElement("div");
    row.className = "msg-row bot";
    row.innerHTML = `
      <div class="msg-inner">
        <div class="msg-avatar" style="font-size:11px;font-weight:700;color:#fff;letter-spacing:.5px;">RC</div>
        <div class="msg-content">
          <div class="msg-name">RAG Chat</div>
          <div class="msg-bubble"></div>
        </div>
      </div>`;
    messagesEl.appendChild(row);
    scrollBottom();
    return row.querySelector(".msg-bubble");
  }

  function addThinking() {
    hideWelcome();
    const row = document.createElement("div");
    row.className = "thinking-row";
    row.innerHTML = `
      <div class="thinking-inner">
        <div class="thinking-avatar" style="font-size:11px;font-weight:700;color:#fff;letter-spacing:.5px;">RC</div>
        <div class="thinking-body">
          <div class="thinking-label">RAG Chat</div>
          <div class="dots"><span></span><span></span><span></span></div>
        </div>
      </div>`;
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function escapeHtml(t) {
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  async function sendMessage() {
    const question = chatInput.value.trim();
    if (!question || isStreaming) return;
    isStreaming = true;
    btnSend.disabled = true;
    chatInput.value = "";
    autoResize();

    addUserMessage(question);
    history.push({ role: "user", content: question });
    const thinking = addThinking();

    try {
      const res = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history: history.slice(0, -1) }),
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail || "Request failed"); }

      thinking.remove();
      const bubble = addBotMessage();
      bubble.closest(".msg-row").classList.add("streaming");

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText  = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        const lines = decoder.decode(value).split("\n");
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const token = line.slice(6);
          if (token === "[DONE]") break;
          if (token.startsWith("[ERROR]")) { bubble.innerHTML += `<br><br>⚠ ${token.slice(8)}`; break; }
          fullText += token;
          bubble.innerHTML = marked.parse(fullText);
          scrollBottom();
        }
      }

      bubble.closest(".msg-row").classList.remove("streaming");
      history.push({ role: "assistant", content: fullText });
      await checkHealth();

    } catch (err) {
      thinking.remove();
      const bubble = addBotMessage();
      bubble.textContent = "⚠ " + err.message;
    } finally {
      isStreaming = false;
      btnSend.disabled = false;
      chatInput.focus();
    }
  }

  function suggest(btn) {
    chatInput.value = btn.textContent;
    sendMessage();
  }

  function autoResize() {
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 180) + "px";
  }
  chatInput.addEventListener("input", autoResize);
  chatInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  btnSend.addEventListener("click", sendMessage);

  function showToast(msg, type = "info") {
    const t = document.createElement("div");
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  (async () => {
    await checkHealth();
    await loadDocuments();
    chatInput.focus();
    setInterval(checkHealth, 30000);
  })();
</script>
</body>
</html>
